name: Checks

# Lint, typecheck, build and the headless probes — the CI this repo runs on
# every push and pull request. It is not the deploy; pages.yml is. It exists
# separately because pages.yml runs `pnpm build` (which does typecheck) but
# never `pnpm lint`, so this file is the only place the lint gate runs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # vite.config.ts shells out to `git rev-list --count HEAD` for the
          # on-screen build number — needs full history, not the default
          # shallow clone, or it undercounts.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      # The headless probes. None of these touch the network or a browser, and
      # they are the regression guards for things that each shipped broken and
      # silent once already — so they belong somewhere that runs without
      # anyone remembering to.
      #
      # docs/todo.md entry 120 added probe:camera-arm, and the reason is the
      # entry itself: armed camera mode died after fifteen seconds on every
      # device with no motion data, from build 372 to build 420, and the probe
      # that would have caught it existed the whole time — it simply had no
      # case for a silent sensor and was not run here.
      - name: Probes
        run: |
          pnpm probe
          pnpm probe:shake
          pnpm probe:fullscreen
          pnpm probe:camera-arm
          pnpm probe:raise-camera
          pnpm probe:origin
          # docs/plans/session-extraction.md — the pointer recogniser as pure
          # state, and (probe:session) the whole session running under Node
          # with no UI at all: the claim the extensibility refactor is built
          # on, and nothing else here checks it.
          pnpm probe:gestures
          pnpm probe:session
