<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hud probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
  #tag {
    position: fixed; top: 4px; left: 6px; z-index: 99;
    font: 11px ui-monospace, monospace; color: #0f0; background: #000a; padding: 2px 5px;
  }
</style>
<div id="tag">boot</div>
<script type="module">
  import { createHud } from '/src/hud.ts'

  const calls = []
  const prefs = {
    geometricView: 'circles',
    geoColour: { r: 1, g: 0.3, b: 0.4 },
    atmosphericView: 'field',
    mergeMode: 'normal',
    atmMergeMode: 'screen',
    mix: 0.62,
    geoAlpha: 0.62,
    atmColour: { r: 1, g: 1, b: 1 },
    camColour: { r: 1, g: 1, b: 1 },
    atmAlpha: 1,
    mapping: 'relative',
    passthrough: 0,
    autopilot: true,
    showStats: false,
    gravity: false,
    day: false,
    skyOverride: 'auto',
  }
  // A fake LookControls: apply() logs the patch and mutates `prefs` directly,
  // the way the real session's apply() would have — so the bands redraw from
  // the same object they read, and one settled drag shows as one `apply` plus
  // one `persist` rather than one per frame.
  const hud = createHud({
    look: prefs,
    apply: (patch, opts) => {
      Object.assign(prefs, patch)
      calls.push(['apply', JSON.stringify([patch, opts])])
    },
    persist: () => calls.push(['persist', '']),
    // Grants whatever is asked for. The refusal path is the camera probe's
    // job; here the point is only that the ring's commit round-trips through
    // a promise and lands back on the control.
    setPassthrough: async (a) => {
      calls.push(['passthrough', String(a)])
      return a
    },
    solo: (l) => calls.push(['solo', l]),
    unsolo: () => calls.push(['unsolo', '']),
  }, true)
  window.calls = calls
  // Exposed so a test can drive lookChanged() directly — a shuffle
  // (docs/todo.md entry 15) isn't reachable through a pointer gesture the
  // way every other change here is.
  window.hud = hud

  // The HUD opens on a document-level pointerup whose travel is under
  // TAP_SLOP_PX. Synthesise a real tap rather than reaching inside the module:
  // this file uses setPointerCapture, so anything that bypasses real
  // PointerEvents proves less than it looks like it does.
  const at = (type, x, y) =>
    document.elementFromPoint(x, y)?.dispatchEvent(
      new PointerEvent(type, { clientX: x, clientY: y, pointerId: 1, bubbles: true, cancelable: true }),
    )

  window.tap = (x, y) => {
    document.dispatchEvent(new PointerEvent('pointerdown', { clientX: x, clientY: y, pointerId: 1, bubbles: true }))
    at('pointerdown', x, y)
    at('pointerup', x, y)
    document.dispatchEvent(new PointerEvent('pointerup', { clientX: x, clientY: y, pointerId: 1, bubbles: true }))
    return describe()
  }

  // docs/todo.md entry 41 moved tap-to-open out of hud.ts and into a single
  // recogniser in main.ts, which this probe doesn't load — so open the panel
  // directly rather than simulating a document-level tap that nothing here
  // listens for any more.
  window.openHud = () => {
    hud.open()
    return describe()
  }

  // Drag along the ring, in screen coordinates.
  //
  // The moves are dispatched at the element the drag *started* on rather than
  // at whatever is under each point, which is what a captured pointer does for
  // real. Synthetic pointers cannot be captured — setPointerCapture throws
  // because the id is not an active pointer — so this stands in for it, and
  // the HUD's drags are written not to depend on capture succeeding.
  window.drag = (pts) => {
    const [x0, y0] = pts[0]
    const target = document.elementFromPoint(x0, y0)
    if (!target) throw new Error(`nothing at ${x0},${y0}`)
    const send = (type, x, y) =>
      target.dispatchEvent(
        new PointerEvent(type, { clientX: x, clientY: y, pointerId: 1, bubbles: true, cancelable: true }),
      )
    send('pointerdown', x0, y0)
    for (const [x, y] of pts.slice(1)) send('pointermove', x, y)
    const [xn, yn] = pts[pts.length - 1]
    send('pointerup', xn, yn)
    return target.getAttribute('class')
  }

  /** A point on band `i` at `t` (0-1) along its own arc, in screen
   *  coordinates — what a drag along that band has to be aimed at. Scalar
   *  bands (opacity, R/G/B) map their value onto SCALAR_A-SCALAR_B, a
   *  narrower span than enum bands' SWEEP_A-SWEEP_B, so both ends actually
   *  land on screen — see docs/todo.md entry 14. Pass `scalar: true` for
   *  those; enum bands (View, Merge, Map) still use the wedge's full sweep. */
  window.bandPoint = (i, t, scalar = false) => {
    const w = window.innerWidth, h = window.innerHeight
    const base = Math.min(w, h)
    const cx = w + 10, cy = h + 10
    const r = base * [0.88, 0.75, 0.63, 0.53, 0.43, 0.33][i]
    const [lo, hi] = scalar ? [190, 260] : [165, 285]
    const a = (lo + t * (hi - lo)) * (Math.PI / 180)
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)]
  }

  // What is on screen, and whether any of it has escaped the viewport.
  window.describe = () => {
    const vw = window.innerWidth, vh = window.innerHeight
    const out = { viewport: [vw, vh], offscreen: [], chips: [], bands: [], captions: [] }
    for (const b of document.querySelectorAll('.hud-chip')) {
      const r = b.getBoundingClientRect()
      const rec = {
        label: b.getAttribute('aria-label'),
        on: b.getAttribute('aria-pressed') === 'true',
        x: Math.round(r.left), y: Math.round(r.top),
        w: Math.round(r.width), h: Math.round(r.height),
      }
      out.chips.push(rec)
      if (r.left < -0.5 || r.top < -0.5 || r.right > vw + 0.5 || r.bottom > vh + 0.5) {
        out.offscreen.push(rec)
      }
    }
    // Straight edges are forbidden in the control surface — see CLAUDE.md.
    out.straightEdges = document.querySelectorAll(
      '.hud-dial rect, .hud-dial line:not(.hud-tick)').length
    out.captions = [...document.querySelectorAll('.hud-band-label')].map(t => t.textContent)
    out.bands = [...document.querySelectorAll('.hud-dial .hud-track')].length
    out.items = [...document.querySelectorAll('.hud-item')]
      .filter(t => +(t.getAttribute('opacity') || 0) > 0.5)
      .map(t => ({ text: t.textContent, on: t.classList.contains('on') }))
    out.calls = calls.slice(-6)
    out.prefs = {
      geoAlpha: prefs.geoAlpha, atmAlpha: prefs.atmAlpha, passthrough: prefs.passthrough,
      geoColour: prefs.geoColour, atmColour: prefs.atmColour, camColour: prefs.camColour,
      mergeMode: prefs.mergeMode, atmMergeMode: prefs.atmMergeMode, mapping: prefs.mapping,
      autopilot: prefs.autopilot, showStats: prefs.showStats,
    }
    return out
  }

  window.prefsRef = prefs
  document.getElementById('tag').textContent = `${window.innerWidth}x${window.innerHeight}`
  document.title = 'ready'
</script>
