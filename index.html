<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the canvas runs under the notch/home indicator.
         user-scalable=no because pinch-zoom on a fullscreen canvas is only ever
         an accident. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>kiyo · plays</title>
    <style>
      :root {
        color-scheme: dark;
        /* Overwritten per-build by release-tone.ts before the gate paints. */
        --tone-hue: 220;
        /* Read from JS (main.ts, the screenshot band) via getComputedStyle —
           env() has no JS-side equivalent, and the band is a hit test, not
           an element, so it needs a number rather than a rule to sit above. */
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #05060a;
        color: #cfd3dd;
        font:
          400 16px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        /* No rubber-band scroll or double-tap zoom over the canvas. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* The powder easter egg (docs/todo.md entry 46) — a black field over
         the hidden picture, tap and drag to throw down white grains. Above
         #canvas, below #gate: three taps on the gate's own background swap
         one for the other by toggling `hidden` here rather than tearing the
         gate down, so leaving restores it exactly as it was. A separate
         layer and a separate canvas from the running piece's own, on
         purpose — the mode is all black, so nothing the WebGL canvas draws
         is ever visible at the same time it is, and a 2D canvas is a few
         dozen lines against a shader-side feature that would need six
         geometric fragment shaders taught about a mode none of them show. */
      #powder {
        position: fixed;
        inset: 0;
        z-index: 6;
        background: #000;
      }
      #powder[hidden] { display: none; }
      #powder-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Opacity, not display: a shake fires inside the render loop and the
         transition needs a frame to actually animate rather than jumping
         straight to invisible. Layered above the canvas, below the gate. */
      #shake-flash {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        /* 260ms → 450ms: long enough to register on a screen someone is
           also physically shaking, still clearly shorter than the double's
           340ms two-pulse sequence below. */
        transition: opacity 450ms ease-out;
      }
      #shake-flash.on {
        opacity: 0.9;
        transition: none;
      }
      /* A double gets a second pulse rather than a longer one, so the two
         read as two events on screen the same way the buzz makes them read
         as two events by feel. */
      /* The app's own R-channel tint (see CHANNELS in hud.ts), reused rather
         than inventing a second red nobody chose on purpose — one colour
         language for "red" across the whole HUD. */
      #shake-flash.double {
        background: #ff4d5e;
        animation: shake-flash-double 340ms ease-out;
      }
      @keyframes shake-flash-double {
        0%   { opacity: 0.9; }
        35%  { opacity: 0.15; }
        55%  { opacity: 0.9; }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #shake-flash { transition: none; }
        #shake-flash.double { animation: none; }
      }
      /* docs/todo.md entry 54. `#shake-flash` is the diagnostic — gated
         behind the numeric readout, and it stays exactly as it is, for the
         job it already does well. This is the feedback everyone gets,
         always on: entry 40 abandoned the buzz, which leaves the shake as
         the one gesture in the app with no confirmation at all in
         ordinary use. A brief inward pulse at the frame's edges rather
         than another full-screen flash — "the picture looks knocked
         rather than lit" is the whole shape of it, and a flash on every
         shake once this ships permanently would turn a quiet instrument
         into a strobe, exactly the trap `#shake-flash`'s own comment
         already named. `--pulse-amt`, set from JS via `intensity()`, is
         how a light shake gets a faint edge and a hard one gets an
         unmistakable one — one normaliser, a third consumer alongside the
         buzz and the shuffle's own depth. */
      #shake-pulse {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 14vmin 3vmin rgba(255, 255, 255, 0.9);
      }
      /* ~220ms — an eye can resolve this; the buzz's own 26ms on-pulses
         cannot be borrowed here for exactly that reason. */
      #shake-pulse.on {
        animation: shake-pulse 220ms ease-out;
      }
      /* Two peaks ~190ms apart, the same shape `#shake-flash.double` above
         already uses for the same reason: a double has to read as two
         events, not one longer one. */
      #shake-pulse.double {
        animation: shake-pulse-double 410ms ease-out;
      }
      @keyframes shake-pulse {
        0%   { opacity: var(--pulse-amt, 0.6); }
        100% { opacity: 0; }
      }
      @keyframes shake-pulse-double {
        /* 410ms total; the second peak lands at 46% = ~190ms, matching the
           entry's own "about 190ms between the two of a double". */
        0%   { opacity: var(--pulse-amt, 0.6); }
        30%  { opacity: 0.05; }
        46%  { opacity: var(--pulse-amt, 0.6); }
        100% { opacity: 0; }
      }
      /* Softened, not removed — deleting the only confirmation this
         gesture has would reinstate the exact bug for anyone who asked
         for less movement. Lower peak opacity (a settle, not a pulse) and
         a longer fade, the same call version.ts already makes for the
         fresh-build dot: "it still goes green; it just stops blinking." */
      @media (prefers-reduced-motion: reduce) {
        #shake-pulse.on {
          animation: shake-pulse-reduced 500ms ease-out;
        }
        #shake-pulse.double {
          animation: shake-pulse-double-reduced 700ms ease-out;
        }
      }
      @keyframes shake-pulse-reduced {
        0%   { opacity: calc(var(--pulse-amt, 0.6) * 0.5); }
        100% { opacity: 0; }
      }
      @keyframes shake-pulse-double-reduced {
        0%   { opacity: calc(var(--pulse-amt, 0.6) * 0.5); }
        45%  { opacity: 0.03; }
        60%  { opacity: calc(var(--pulse-amt, 0.6) * 0.5); }
        100% { opacity: 0; }
      }
      /* docs/todo.md entry 41. A glyph rather than a full-screen tint —
         `#shake-flash`'s white already means "a shake was detected" when the
         readout is on, and this needs to read as a different event from
         that at the exact moment someone is trying to tell them apart. */
      #capture-flash {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 480ms ease-out;
      }
      #capture-flash svg {
        width: 22vmin;
        height: 22vmin;
        color: #fff;
        filter: drop-shadow(0 2px 10px rgba(5, 6, 10, 0.65));
      }
      #capture-flash.on {
        opacity: 0.92;
        transition: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #capture-flash { transition: none; }
      }
      /* docs/todo.md entry 72: a viewfinder mark, not a button — resting at
         low opacity so it reads as "you are in camera mode" rather than
         inviting a press of its own (the shutter is any tap of the picture,
         everywhere, not this glyph specifically). DOM, like #capture-flash
         above it, so it can never enter the photo it is announcing. */
      #shutter-glyph {
        position: fixed;
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        width: 20vmin;
        height: 20vmin;
        color: #fff;
        opacity: 0.25;
        pointer-events: none;
        z-index: 6;
      }
      #shutter-glyph[hidden] { display: none; }
      /* docs/todo.md entry 109 — an automatic expiry (posture and tilt both
         read as put-down for the quiet window, or the five-minute ceiling)
         fades the glyph out over GLYPH_FADE_MS rather than toggling
         `hidden` straight to `display: none`, so leaving camera mode this
         way is a visible signal rather than the silent vanish entry 87
         chose back when a late tap still saved a frame. A manual exit (a
         tap on the picture, or the chip) is untouched — main.ts's own
         `exitCameraMode` still hides it instantly. */
      #shutter-glyph.fading { opacity: 0; transition: opacity 600ms ease-out; }
      /* The one mechanical gesture a camera makes: a contraction and a
         bloom back, restrained rather than decorated — no shutter sound, no
         border flash, no vignette, so this single movement is what reads.
         `scale`, not `transform: scale()`, so it composes with the fixed
         `translate` above instead of needing to repeat it in every frame. */
      #shutter-glyph.pulse { animation: shutter-pulse 180ms ease-out; }
      @keyframes shutter-pulse {
        0% { scale: 1; }
        40% { scale: 0.85; }
        100% { scale: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #shutter-glyph.pulse { animation: none; }
      }
      /* The gate is an overlay on the running piece, not a page in front of it.
         The canvas behind is already drawing (see idleParams in main.ts), so
         this screen's job is to stay out of its way and still be readable —
         and, since docs/todo.md entry 43, to lean a little further toward
         readable: the type is bigger and the head block sits on its own band,
         which trades a bit of "out of its way" for legibility on purpose.

         Stripped to Start and the code. The two paragraphs that used to sit
         here are gone at Victor's instruction; what that removed is noted in
         the commit, because one of them carried the promise the page makes
         about the microphone. */
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-end;
        gap: clamp(1rem, 3.5vh, 1.9rem);
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem
          calc(1.75rem + env(safe-area-inset-bottom, 0px));
        text-align: right;
        z-index: 10;
        transition: opacity 700ms ease;
        /* One multiplier on every gate text rule rather than eight edited
           numbers — docs/todo.md entry 43. Each clamp() below carries its
           own reasoning about specific viewport widths in a comment; a
           multiplier leaves every one of those numbers legible and makes
           "a bit bigger again" a single edit instead of eight. */
        --gate-type-scale: 1.2;
        /* Dark where the words are, clear where the picture is. Without this
           the type sits on whatever the visualiser happens to be doing and
           becomes unreadable a few seconds in. */
        background: linear-gradient(
          to bottom,
          rgba(5, 6, 10, 0.06) 0%,
          rgba(5, 6, 10, 0.4) 42%,
          rgba(5, 6, 10, 0.86) 74%,
          rgba(5, 6, 10, 0.95) 100%
        );
      }
      #gate[hidden] { display: none; }
      #gate.fading { opacity: 0; pointer-events: none; }

      /* Title and build name, right-justified and large. With the copy gone
         these are the only type on the screen, so they carry it.

         The band (docs/todo.md entry 43) is the gate's own #05060a at 50%,
         not a new colour: it is a scrim making the preview quieter behind
         the words, and any other colour would introduce a second surface to
         a screen deliberately stripped to two things. `position: relative`
         plus an explicit `z-index` gives this element its own stacking
         context, so the band's `z-index: -1` stays scoped to sitting behind
         this block's own text rather than competing with #gate's other
         children (Start, the QR code, the share button) for stacking order.
         Full-bleed horizontally via `inset` reaching past this element's own
         box by exactly #gate's own 1.5rem side padding, so the band spans
         edge to edge regardless of where the (right-aligned, narrow) text
         itself sits. */
      .gate-head {
        position: relative;
        z-index: 0;
        text-align: right;
        padding: 0.5rem 0;
      }
      .gate-head::before {
        content: '';
        position: absolute;
        inset: 0 -1.5rem;
        background: rgba(5, 6, 10, 0.5);
        z-index: -1;
      }
      /* Byline (queue entry 10, revised by entry 28). Entry 10 set this
         deliberately quieter than .gate-name below it, reasoning that the
         screen has exactly one thing designed to dominate — the filled Start
         disc — and a byline loud enough to compete with the title would be a
         second one. That held at 0.62rem against the release name's larger
         clamp(), which is still true; what did not hold was the colour: at
         #454b5c against the gate's #05060a background this measured 2.33:1,
         under the 4.5:1 small text needs, and the *real* cause was that this
         was the only line on the gate with no text-shadow while the idle
         preview drew a moving picture behind all three. Entry 28 matches
         .gate-name's own colour and shadow — the hierarchy still reads
         because it was always carried by size, not colour, and matching
         colours just makes the bottom of that order legible instead of
         nearly invisible. */
      .gate-byline {
        font: 400 calc(0.62rem * var(--gate-type-scale))/1 ui-monospace, SFMono-Regular, Menlo,
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8d88b8;
        /* Two shadows, comma-separated, dark one first — docs/todo.md entry
           55. Added alongside entry 28's dark shadow, never replacing it:
           that shadow exists because at #8d88b8 over the moving idle
           preview this measured 2.33:1, under the 4.5:1 small text needs,
           and it is still doing that job here. The second, a glow in the
           byline's own colour, animates independently below — a still
           frame of this rule alone would make the dark shadow look
           redundant, and it is not. */
        text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95), 0 0 8px rgba(141, 136, 184, 0);
        margin: 0 0 0.3rem;
        /* 4.7s — chosen against the Start disc's own 3.4s and 5.9s
           (entry 16) so the three never fall into step. A third animation
           on the same small screen makes that matter more, not less. */
        animation: byline-glow 4.7s ease-in-out infinite;
      }
      /* Only the glow term moves; the dark shadow ahead of it in both
         keyframes is identical, so it never visibly flickers. */
      @keyframes byline-glow {
        0%, 100% { text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95), 0 0 8px rgba(141, 136, 184, 0); }
        50%      { text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95), 0 0 8px rgba(141, 136, 184, 0.6); }
      }
      /* Held static at mid-strength rather than removed — the request was
         for the name to look alive, and a still glow is still a glow. Same
         call entry 54 makes for the shake pulse and version.ts already
         makes for the fresh-build dot. */
      @media (prefers-reduced-motion: reduce) {
        .gate-byline {
          animation: none;
          text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95), 0 0 8px rgba(141, 136, 184, 0.3);
        }
      }
      /* docs/todo.md entry 99 — the diagnosis, made visible where the
         problem is reported. Five rounds of "the animation still isn't
         showing" each fixed a real cause without anyone confirming the
         phone was actually in `prefers-reduced-motion: reduce` — that
         needed `?debug`, and the person hitting this never opens it. This
         is the one-glance answer instead: a single faint dot beside the
         byline, filled when motion plays in full, hollow when it is
         reduced (the same filled/hollow vocabulary `.queue-dot` already
         uses for shipped vs waiting). `version.ts` toggles `.full`; the
         hollow, unfilled state is the default so a script-disabled page
         still renders something coherent rather than a stray filled dot
         with no meaning behind it. Faint on purpose — this is a diagnostic
         for whoever goes looking, not a label for everyone else. */
      .motion-glyph {
        display: inline-block;
        width: 4px;
        height: 4px;
        margin-left: 0.55em;
        border-radius: 50%;
        border: 1px solid currentColor;
        opacity: 0.4;
        vertical-align: middle;
      }
      .motion-glyph.full { background: currentColor; }
      #gate h1 {
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
        /* docs/todo.md entry 43: at 320px the middle term becomes 10.8vw,
           rendering about 34.6px against 28.8px before this — the one place
           this change can overflow or wrap. If it does, the fix is this vw
           term, not the max: the max only bites on wide screens, which are
           not where the problem would be. */
        font-size: calc(clamp(1.7rem, 9vw, 2.6rem) * var(--gate-type-scale));
        font-weight: 600;
        letter-spacing: 0.24em;
        /* Optical alignment: the tracking adds a phantom space after the last
           glyph, which on a right-justified line is a visible indent. */
        margin: 0 -0.24em 0.25rem 0;
        text-transform: uppercase;
        color: #eceaf8;
        text-shadow: 0 1px 14px rgba(5, 6, 10, 0.95);
        line-height: 1;
      }
      /* docs/todo.md entry 133 — the reduced-motion decode's unresolved tail.
         Present from the first frame at reduced opacity rather than absent,
         so the name is legible as a shape immediately and the element never
         changes width as it fills. A dimmed character brightening is a fade,
         which is what `prefers-reduced-motion` asks for; the alternative that
         shipped was an empty span, which is indistinguishable from a broken
         one and was reported as exactly that, four times. */
      .name-pending {
        opacity: 0.32;
      }
      .gate-name {
        font: 500 calc(clamp(0.95rem, 4.4vw, 1.3rem) * var(--gate-type-scale))/1 ui-monospace,
          SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        margin-right: -0.2em;
        text-transform: uppercase;
        color: #8d88b8;
        text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95);
      }
      /* docs/todo.md entry 55. Reserved rather than animated, so the flip
         through the release history never reflows: `.gate-head` is
         right-aligned, and without a fixed box here a shorter name would
         float further right and a longer one further left as the text
         itself changes width — "the whole line walk[ing] leftward and
         back", in the entry's own words. `inline-block` plus its own
         `text-align: right` is what lets the reserved box's *right* edge
         stay exactly where the unreserved span's right edge already sat,
         with every name — short or long — floating against it.
         `release-name.ts`'s own docstring caps a name at "under about 18
         characters"; reserved at that ceiling rather than at today's
         actual longest (15, "already playing"), so a future name within
         the file's own stated limit can never reflow this either. */
      #release-name {
        display: inline-block;
        min-width: 18ch;
        text-align: right;
        /* docs/todo.md entry 99 — the reduced-motion fallback of last
           resort (no release history to flip through at all) fades the
           name up rather than snapping it in; see version.ts's own
           `fadeInName`. Opacity only, so this never competes with the
           reserved-width rule above about what can and cannot reflow. */
        transition: opacity 400ms ease;
      }

      /* The only filled shape on the screen, so the action needs no words —
         but the words it does carry (docs/todo.md entry 51) are an
         invitation, not an instruction: lowercase, set as three centred
         lines rather than one shouted word, because a circle is widest
         across its middle and "play with me" on one line inside this disc
         at 320px does not happen at any weight worth reading. The label
         itself carries the line breaks as literal `\n` characters
         (`white-space: pre-line` below honours them) rather than `<br>`
         markup, so `permission-gate.ts`'s error-path relabel
         (`textContent = 'once\nmore'`) stays a plain string assignment. */
      #start {
        appearance: none;
        cursor: pointer;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        white-space: pre-line;
        width: min(36vw, min(20vh, 8rem));
        aspect-ratio: 1;
        border-radius: 50%;
        border: none;
        background: #9d9bf0;
        color: #05060a;
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(0.95rem, 4vw, 1.15rem);
        font-weight: 600;
        line-height: 1.15;
        /* Narrow rather than gone: entirely untracked lowercase at this
           weight reads a little cramped across three short stacked words.
           The old 0.14em was tuned for shouted, evenly-spaced capitals and
           is a luxury-logotype amount for lowercase — its own
           `text-indent: 0.14em` compensated for the phantom trailing space
           that tracking adds after the last glyph, and goes with it rather
           than being retuned: at 0.02em that phantom space is negligible. */
        letter-spacing: 0.02em;
        /* Two periods that don't divide into one another (3.4s, 5.9s), so the
           pair returns to the same phase roughly every 200s rather than every
           cycle — what keeps this reading as alive rather than as a metronome. */
        animation: start-pulse 3.4s ease-out infinite,
          start-breathe 5.9s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        transition: background 180ms ease, transform 180ms ease;
      }
      /* One slow ring leaving the button — the only motion this screen adds to
         what the visualiser is already doing, and it exists to say which of the
         things on screen is the one to press. More reach, not more speed
         (docs/todo.md entry 43): the spread grew 18px -> 26px and the starting
         opacity 0.4 -> 0.55, but the two periods below are untouched — they are
         chosen not to divide into one another, so the pulse and the breathe
         re-phase roughly every 200s, which is what keeps this reading as alive
         rather than as a metronome. Speeding either up is the fastest way to
         turn inviting into nagging. */
      @keyframes start-pulse {
        0% { box-shadow: 0 0 0 0 rgba(157, 155, 240, 0.55); }
        70% { box-shadow: 0 0 0 26px rgba(157, 155, 240, 0); }
        100% { box-shadow: 0 0 0 0 rgba(157, 155, 240, 0); }
      }
      /* A slow breathe — about 6px of growth on a 114px disc, up from about 4px
         (docs/todo.md entry 43). The `scale` property, not `transform:
         scale()`: #start:active already animates `transform`, which would
         silently outrank and delete the press feedback if this used the same
         property. `alternate` mirrors the easing at both ends, so it dwells the
         way breathing does, where a 0-100% keyframe loop would snap back
         instead. */
      @keyframes start-breathe {
        from { scale: 1; }
        to { scale: 1.05; }
      }
      #start:hover,
      #start:focus-visible { background: #b9b7ff; }
      #start:active { transform: scale(0.97); }
      #start:disabled { background: #4a4870; color: #14141f; cursor: default; animation: none; }

      /* Bigger than Start on purpose (queue entry 4): handing the link to
         someone in the room is one of two things this screen is for, and at
         the old 80px the code was a footnote. clamp(9rem, 48vw, 10.5rem) is
         ~154px at 320px width, ~154px at 360, capped at 168px above that —
         chosen to land close to the ~155px target without depending on any
         one viewport width exactly. */
      .gate-qr {
        width: clamp(9rem, 48vw, 10.5rem);
        height: clamp(9rem, 48vw, 10.5rem);
        display: block;
        opacity: 0.9;
      }
      .gate-qr[hidden] { display: none; }

      /* A circular chip on the gate — the same size as a HUD chip, because it
         is the same kind of object (see the no-straight-lines rule in
         CLAUDE.md). Shared between the share button and the reload glyph
         (docs/todo.md entry 44) rather than a second copy of the same nine
         declarations. */
      .gate-chip {
        appearance: none;
        cursor: pointer;
        width: 2.9rem;
        height: 2.9rem;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(12, 12, 26, 0.7);
        border: 1px solid rgba(44, 41, 71, 0.9);
        color: #b9bece;
        transition: border-color 160ms ease, color 160ms ease;
      }
      .gate-chip:hover,
      .gate-chip:focus-visible { border-color: #9d9bf0; color: #f0eeff; }
      .gate-chip svg { width: 19px; height: 19px; display: block; }

      /* Share, in the top-right corner — everything but its own position and
         "copied" state now lives in .gate-chip above. The z-index is for short
         screens: .gate-head comes later in the DOM with a stacking context of
         its own, and at 844x390 it reaches this corner, which left 6% of the
         icon tappable. */
      .gate-share {
        position: absolute;
        z-index: 1;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        right: calc(1.1rem + env(safe-area-inset-right, 0px));
      }
      /* Says "copied" without a word, for the desktop fallback path. */
      .gate-share.done { border-color: #5fe3a1; color: #5fe3a1; }

      /* docs/todo.md entry 93 — the queue this build came from. Bottom-left,
         mirroring .gate-name's own right-aligned column on the other side
         of the screen; the same quiet tone as .gate-byline, not a second
         headline. `position: absolute` inside #gate (which is itself
         `position: fixed`), the same technique .gate-share already uses for
         its own corner, so this sits clear of #gate's own right-aligned
         flex column (Start, the QR, the header) regardless of viewport
         height. `pointer-events: none` throughout — Decided is explicit
         that this can never eat a tap the gate's own controls are
         competing for. */
      #queue-panel {
        position: absolute;
        left: calc(1.5rem + env(safe-area-inset-left, 0px));
        bottom: calc(1.75rem + env(safe-area-inset-bottom, 0px));
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 0.22rem;
        pointer-events: none;
        text-align: left;
        font: 400 calc(0.62rem * var(--gate-type-scale))/1.3 ui-monospace, SFMono-Regular, Menlo,
          monospace;
        letter-spacing: 0.02em;
        color: #8d88b8;
        text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95);
        /* Found by actually looking at this on screen, not derived from
           Decided (which frames height as the only real constraint): at
           320-360px the QR code — also bottom-anchored, opposite corner —
           is wide enough that a naive width let the two overlap outright.
           36vw keeps this column's right edge clear of the QR's left edge
           at both 320 and 360px width, with headroom; capped in absolute
           terms too so it never grows unreasonably wide on anything
           bigger. Whatever still doesn't fit inside it is `.queue-text`'s
           own ellipsis below, on top of the 24-character cap
           queue-panel.ts's data already carries. **Mine.** */
        max-width: min(36vw, 11rem);
      }
      /* A filled dot for shipped, a hollow one for waiting — Decided's own
         "the same figure the app is made of", encoding state in form
         rather than only in colour. */
      .queue-dot {
        flex: none;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        border: 1px solid currentColor;
      }
      .queue-row-shipped .queue-dot { background: currentColor; }
      .queue-row {
        display: flex;
        align-items: baseline;
        gap: 0.45em;
        opacity: 0;
        transition: opacity 480ms ease;
        white-space: nowrap;
        overflow: hidden;
      }
      .queue-row.queue-shown { opacity: 1; }
      .queue-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .queue-row-shipped { color: #b9bece; }
      .queue-more { color: #6f7789; padding-left: 0.85em; }
      .queue-rule {
        width: 2.2rem;
        height: 1px;
        background: currentColor;
        opacity: 0.3;
        margin: 0.1rem 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .queue-row { transition: none; }
      }
      /* Vertical space is the real constraint (Decided's own framing) — the
         panel drops rows from the bottom as height shrinks: waiting rows
         (and the "+N more" line) first, then the rule, then the shipped
         pair, rather than ever overlapping Start, the QR code or the
         header band. Thresholds are **Mine** — Decided names the order,
         not the pixels. */
      @media (max-height: 660px) {
        #queue-panel .queue-row-waiting,
        #queue-panel .queue-more {
          display: none;
        }
      }
      @media (max-height: 600px) {
        #queue-panel .queue-rule { display: none; }
      }
      @media (max-height: 520px) {
        #queue-panel { display: none; }
      }

      #error {
        position: relative;
        color: #d08a8a;
        background: rgba(42, 20, 20, 0.92);
        padding: 0.5rem 0.7rem;
        font-size: calc(0.76rem * var(--gate-type-scale));
        max-width: 22rem;
        text-align: left;
      }
      #error:empty { display: none; }

      /* docs/todo.md entry 65, revised by entry 99: a swap, not an off
         switch — matching the principle the shake pulse above already
         states, "it still goes green; it just stops blinking." A disc
         whose entire job is to say press me is the last thing that should
         answer less motion by going still. Entry 65's own reduced variant
         shifted `background` between #9d9bf0 and #b9b7ff — two lavenders a
         phone in direct sunlight cannot tell apart, which is the reason
         this was reported as invisible five times over: the failure wasn't
         that the fix never landed, it was that nobody could see whether it
         had. Entry 99 replaces it with a glow: a soft halo that visibly
         swells and fades on the same 3.4s period, plus a brightness swing
         wide enough to read outdoors. Still no box-shadow *spread outward*
         (that is start-pulse's travelling ring, which is the actual
         motion) and no scale (that is start-breathe, which stays off — a
         size change is exactly what the preference asks not to have) —
         only a blur radius and a brightness filter pulsing in place, which
         carry no motion vector at all. **Mine** as to the exact radius and
         brightness figures; the phone in sunlight is what actually settles
         whether they read. */
      @media (prefers-reduced-motion: reduce) {
        #start { animation: start-pulse-reduced 3.4s ease-in-out infinite; }
      }
      @keyframes start-pulse-reduced {
        0%, 100% { box-shadow: 0 0 0 0 rgba(197, 195, 255, 0); filter: brightness(1); }
        50% { box-shadow: 0 0 30px 16px rgba(197, 195, 255, 0.7); filter: brightness(1.4); }
      }

      /* Dead centre of the viewport (docs/todo.md entry 42), reversing entry
         25's top-left placement — Victor's call, made against the built
         result on a phone rather than against a description of it, which is
         the evidence entry 25 did not have. The safe-area insets went with
         the old position: they existed to hold the chip clear of a notch and
         a rounded corner, and a centred element is clear of both by
         construction, so keeping them would leave two terms that no longer
         mean anything. Still a circular chip — the control-surface rule
         governs controls being arcs, not where a round chip may sit. */
      #fullscreen-chip {
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- The powder easter egg (docs/todo.md entry 46) — hidden by default,
         shown only while main.ts's three-tap recogniser on the gate has it
         open. See the style rule above for why it sits above #canvas and
         below #gate. -->
    <div id="powder" hidden>
      <canvas id="powder-canvas"></canvas>
    </div>

    <!-- Debug-only: flashes white on a detected shake, so "did anything fire"
         is answerable by eye when the phone that reported the bug is not
         wired to a console. See shakeFlash() in main.ts. -->
    <div id="shake-flash" aria-hidden="true"></div>

    <!-- Always on, unlike shake-flash above — docs/todo.md entry 54. This
         is the confirmation everyone gets that a shake was accepted; see
         shakePulse() in main.ts. -->
    <div id="shake-pulse" aria-hidden="true"></div>

    <!-- Confirms a screenshot was saved (docs/todo.md entry 41) — a camera
         glyph, not the shake flash's plain white: with the numeric readout
         on, a shake and a capture used to produce the exact same flash. See
         flashCapture() in main.ts. -->
    <div id="capture-flash" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M1.4 2.6h6v3.4H4.8v12H7.4v3.4h-6z" />
        <path d="M22.6 2.6h-6V6h2.6v12h-2.6v3.4h6z" />
        <circle cx="12" cy="12" r="5.6" />
      </svg>
    </div>

    <!-- docs/todo.md entry 72. Hidden until main.ts enters camera mode;
         see #shutter-glyph's own CSS comment for why it is a viewfinder
         mark, not a button. -->
    <div id="shutter-glyph" aria-hidden="true" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="12" cy="12" r="7" />
      </svg>
    </div>

    <!-- The way back into fullscreen once it has been lost (docs/todo.md
         entry 19) — hidden by default, shown by main.ts only while
         permission-gate.ts reports `exited` or `refused`. A sibling of the
         HUD rather than one of its own chips, deliberately: the HUD's own
         chips go inert while its panel is closed
         (`.hud-scrim:not(.open) .hud-chip`), and this one has to work at the
         moment fullscreen is lost, not only once the panel is opened.
         Fixed dead centre of the viewport (see the style rule above, and
         entry 42) rather than placed on the HUD's own icon arc — entry 25
         moved it off the arc after entry 19's own arc placement read as a
         button dropped on the picture whenever the panel was closed, which
         is the only state this chip is ever shown in; entry 42 then moved
         it from the top-left corner entry 25 chose to dead centre, on the
         same "reads as off" evidence, now against the built top-left result
         rather than against a description of it. Entry 41's single tap
         recogniser excludes this chip by target — see main.ts — since
         centring it moved it into the panel-opening middle third. -->
    <button id="fullscreen-chip" class="hud-chip" type="button" hidden
      style="--tint: #9d9bf0" aria-label="Return to fullscreen">
      <svg class="hud-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M1 9V1h8v3H4v5z"/>
        <path d="M23 9V1h-8v3h5v5z"/>
        <path d="M1 15v8h8v-3H4v-5z"/>
        <path d="M23 15v8h-8v-3h5v-5z"/>
      </svg>
    </button>

    <div id="gate">
      <!-- Share, top right. An icon rather than a labelled button: the only
           other control on this screen is Start, so there is nothing for a
           word to disambiguate it from. -->
      <button id="share" type="button" class="gate-chip gate-share" aria-label="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15.5V3.4" />
          <path d="M7.6 7.8 12 3.4l4.4 4.4" />
          <path d="M4.8 13.4v5.4a1.8 1.8 0 0 0 1.8 1.8h10.8a1.8 1.8 0 0 0 1.8-1.8v-5.4" />
        </svg>
      </button>

      <header class="gate-head">
        <p class="gate-byline">by flyflyfly &copy; 2026<span id="motion-glyph" class="motion-glyph" aria-hidden="true"></span></p>
        <!-- docs/todo.md entry 69. The piece is named after a person, and
             that is the whole statement — no "for Kiyo", no dedication, no
             byline, nowhere on screen or in this file. Entry 63 left that
             question open on purpose; Victor closed it: wordless, the name
             itself carries it. This is deliberate, not an omission — do
             not add one. -->
        <h1>kiyo&#8202;&middot;&#8202;plays</h1>
        <div class="gate-name"><span id="release-name"></span></div>
      </header>

      <button id="start" type="button">play
with
me</button>

      <svg id="qr" class="gate-qr" role="img" aria-label="QR code linking to this page"></svg>

      <div id="error" role="status" aria-live="polite"></div>

      <!-- docs/todo.md entry 93. Empty until queue-panel.ts fills it in
           from __QUEUE__ — see that file and vite.config.ts's own
           buildQueue(). Decorative only: see the CSS rule below for why
           it can never eat a tap. -->
      <div id="queue-panel" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
